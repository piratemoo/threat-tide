name: update-vulns-json
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_vulns.py"
      - "scripts/update_discord_posts.py"
      - "threat-tide.js"
      - "threat-tide.css"
      - ".github/workflows/update-vulns-json.yml"
  schedule:
    - cron: "7 2,13,19 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out feed repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build live vuln feed
        env:
          GITHUB_TOKEN: "${{ github.token }}"
          EXTRA_RSS_SOURCES: "${{ secrets.EXTRA_RSS_SOURCES }}"
        run: python scripts/update_vulns.py

      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vulns.json
          git commit -m "Update Threat Tide live vuln feed" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Purge CDN cache
        if: always()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/piratemoo/threat-tide@main/vulns.json" || true
          curl -s "https://purge.jsdelivr.net/gh/piratemoo/threat-tide@main/threat-tide.js" || true
          curl -s "https://purge.jsdelivr.net/gh/piratemoo/threat-tide@main/threat-tide.css" || true

      - name: Update Discord posts
        env:
          DISCORD_VULNS_WEBHOOK: "${{ secrets.DISCORD_VULNS_WEBHOOK }}"
          DISCORD_FEED_WEBHOOK: "${{ secrets.DISCORD_FEED_WEBHOOK }}"
          DISCORD_VID_FEEDS_WEBHOOK: "${{ secrets.DISCORD_VID_FEEDS_WEBHOOK }}"
          DISCORD_VULNS_MESSAGE_ID: "${{ secrets.DISCORD_VULNS_MESSAGE_ID }}"
          DISCORD_FEED_MESSAGE_ID: "${{ secrets.DISCORD_FEED_MESSAGE_ID }}"
          DISCORD_VID_FEEDS_MESSAGE_ID: "${{ secrets.DISCORD_VID_FEEDS_MESSAGE_ID }}"
        run: python scripts/update_discord_posts.py

      - name: Commit Discord post state
        run: |
          git add discord-post-state.json
          git commit -m "Update Discord post state" || echo "No Discord state changes"
          git push || echo "Nothing to push"
